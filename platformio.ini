[platformio]
default_envs = nodemcu-32s

[common]
platform = espressif32
framework = espidf
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    jgromes/RadioLib
lib_ignore =
    RadioLib
build_flags =
    -Wno-error
    -D LOG_LEVEL=3
    -D NAV_ENABLE_GNSS=1
    -include include/RadioLibCompat.h
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_PAGER=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1
    -D RADIOLIB_EXCLUDE_FSK4=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_LORAWAN=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_ADSB=1
    -D RADIO_FREQUENCY_MHZ=2445.0
    -D RADIO_BANDWIDTH_KHZ=812.5
    -D RADIO_SPREADING_FACTOR=7
    -D RADIO_CODING_RATE=5
    -D RADIO_SYNC_WORD=0x12
    -D RADIO_TX_POWER_DBM=2
    -D RADIO_PREAMBLE_LEN=12
    -D RADIO_TX_INTERVAL_MS=10000
build_unflags =
    -Werror

[env:nodemcu-32s]
extends = common
board = nodemcu-32s
board_build.cmake_extra_args =
    -DNAV_PIO_ENV=nodemcu-32s
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.nodemcu-32s
build_flags =
    ${common.build_flags}
    -D BOARD_NAME=\"NodeMCU-32S\"
    -D TARGET_NODEMCU_32S=1
    -D PIN_LORA_SCK=18
    -D PIN_LORA_MISO=19
    -D PIN_LORA_MOSI=23
    -D PIN_LORA_CS=5
    -D PIN_LORA_RST=27
    -D PIN_LORA_BUSY=26
    -D PIN_LORA_DIO1=25
    -D PIN_LORA_DIO2=-1
    -D PIN_LORA_DIO3=-1
    -D PIN_GPS_RX=16
    -D PIN_GPS_TX=17
    -D PIN_STATUS_LED=2
    -D PIN_STATUS_LED_ACTIVE_HIGH=1

[env:esp32-s3-devkitc-1]
extends = common
board = esp32-s3-devkitc-1
board_build.cmake_extra_args =
    -DNAV_PIO_ENV=esp32-s3-devkitc-1
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -D BOARD_NAME=\"ESP32-S3-DEVKITC-1\"
    -D PIN_LORA_SCK=12
    -D PIN_LORA_MISO=13
    -D PIN_LORA_MOSI=11
    -D PIN_LORA_CS=10
    -D PIN_LORA_RST=9
    -D PIN_LORA_BUSY=8
    -D PIN_LORA_DIO1=7
    -D PIN_LORA_DIO2=6
    -D PIN_LORA_DIO3=15
    -D PIN_GPS_RX=16
    -D PIN_GPS_TX=17
    -D PIN_STATUS_RGB_LED=48

; SpeedyBee Nano 2.4G (ESP8285 + SX1280). ESP-IDF is unavailable on ESP8285, so
; this node reuses the portable core over the Arduino/ESP8266 framework. It does
; not extend [common] (different framework). Radio-only board: no GPS.
[env:speedybee]
platform = espressif8266
board = esp8285
framework = arduino
board_build.flash_mode = dout
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -I core/include
    -I ports/speedybee/include
    -I ports/speedybee/lib/SX1280
    -D RADIO_SX1280
build_src_filter =
    -<*>
    +<../ports/speedybee/src/>
    +<../ports/speedybee/lib/SX1280/>
    +<../core/src/nav_core.c>
    +<../core/src/nav_peer_table.c>
    +<../core/src/nav_quality.c>
    +<../core/src/nav_state_machine.c>
    +<../core/src/nav_trilateration.c>
    +<../core/src/nav_logging.c>
    +<../core/src/nav_radio_protocol.c>
    +<../core/src/nav_gnss.c>
    +<../core/src/nav_nmea.c>
    +<../core/src/nav_mock.c>
    +<../core/src/nav_serial_json.c>
    +<../core/src/nav_telemetry.c>
    +<../core/src/nav_tdma.c>
