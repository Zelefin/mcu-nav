; PlatformIO project for the SpeedyBee Nano 2.4G ExpressLRS receiver
; MCU:   ESP8285 (1 MB internal flash, DOUT mode)
; Radio: Semtech SX1280 (2.4 GHz LoRa / GFSK transceiver)
;
; This firmware turns the receiver into a 2.4 GHz spectrum / "band load"
; scanner: it steps the SX1280 across the band and reads the instantaneous
; RSSI of the receiver front-end at each step, printing a live waterfall.
;
; Hardware target taken from ExpressLRS/targets -> "Generic 2400 PA.json"
; (product: "SpeedyBee Nano 2.4GHz RX", platform: esp8285).

[platformio]
default_envs = speedybee_nano_2400_rx

[env:speedybee_nano_2400_rx]
platform  = espressif8266
board     = esp8285
framework = arduino

; ESP8285 has 1 MB internal flash that MUST be driven in DOUT (1-bit) mode,
; which frees GPIO9 / GPIO10 for use as the PA RX/TX-enable lines.
board_build.flash_mode = dout
board_build.f_cpu      = 80000000L

monitor_speed = 115200
upload_speed  = 460800

; Serial upload over the RX/TX pads (FTDI). To enter the bootloader, hold the
; BOOT button (GPIO0 -> GND) while powering the board, then release.
; If you prefer Wi-Fi or Betaflight-passthrough flashing, see README.md.
upload_protocol = esptool

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D RADIO_SX1280
