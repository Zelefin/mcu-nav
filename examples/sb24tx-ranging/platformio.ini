; PlatformIO project for SpeedyBee Nano 2.4G SX1280 ranging bring-up.
; MCU:   ESP8285 (1 MB internal flash, DOUT mode)
; Radio: Semtech SX1280 2.4 GHz ranging engine

[platformio]
default_envs = speedybee_nano_2400_rx

[env:speedybee_nano_2400_rx]
platform  = espressif8266
board     = esp8285
framework = arduino

; ESP8285 internal flash must use DOUT mode so GPIO9/GPIO10 remain available
; for the external PA/LNA RXEN/TXEN pins on this board.
board_build.flash_mode = dout
board_build.f_cpu      = 80000000L

monitor_speed = 115200
upload_speed  = 460800
upload_protocol = esptool

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D RADIO_SX1280
