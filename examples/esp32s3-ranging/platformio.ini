; PlatformIO project for ESP32-S3 + E28-2G4M12SX SX1280 ranging bring-up.
; MCU:   ESP32-S3-DEVKITC-1
; Radio: Semtech SX1280 2.4 GHz ranging engine

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

lib_deps =
    jgromes/RadioLib

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_NAME=\"ESP32-S3-DEVKITC-1\"
    -D PIN_LORA_SCK=12
    -D PIN_LORA_MISO=13
    -D PIN_LORA_MOSI=11
    -D PIN_LORA_CS=10
    -D PIN_LORA_RST=9
    -D PIN_LORA_BUSY=8
    -D PIN_LORA_DIO1=7
    -D PIN_BOOT_SELECT=0
    -D PIN_STATUS_LED=-1
