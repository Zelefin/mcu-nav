; PlatformIO project for ESP32-S3 + E28-2G4M12SX SX1280 ranging bring-up.
; MCU:   ESP32-S3-DEVKITC-1
; Radio: Semtech SX1280 2.4 GHz ranging engine

[platformio]
default_envs = esp32-s3-devkitc-1

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

lib_deps =
    jgromes/RadioLib
lib_ignore =
    RadioLib

build_flags =
    -include include/RadioLibCompat.h
    -D RADIOLIB_EXCLUDE_AFSK=1
    -D RADIOLIB_EXCLUDE_AX25=1
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -D RADIOLIB_EXCLUDE_MORSE=1
    -D RADIOLIB_EXCLUDE_PAGER=1
    -D RADIOLIB_EXCLUDE_RTTY=1
    -D RADIOLIB_EXCLUDE_SSTV=1
    -D RADIOLIB_EXCLUDE_FSK4=1
    -D RADIOLIB_EXCLUDE_APRS=1
    -D RADIOLIB_EXCLUDE_LORAWAN=1
    -D RADIOLIB_EXCLUDE_BELL=1
    -D RADIOLIB_EXCLUDE_ADSB=1
    -D BOARD_NAME=\"ESP32-S3-DEVKITC-1\"
    -D PIN_LORA_SCK=12
    -D PIN_LORA_MISO=13
    -D PIN_LORA_MOSI=11
    -D PIN_LORA_CS=10
    -D PIN_LORA_RST=9
    -D PIN_LORA_BUSY=8
    -D PIN_LORA_DIO1=7
    -D PIN_BOOT_SELECT=0
    -D PIN_STATUS_LED=-1

[env:esp32-s3-devkitc-1]
extends = common
board_build.cmake_extra_args =
    -DRANGING_PIO_ENV=esp32-s3-devkitc-1
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1-master]
extends = common
board_build.cmake_extra_args =
    -DRANGING_PIO_ENV=esp32-s3-devkitc-1-master
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -D FORCE_RANGING_ROLE=1

[env:esp32-s3-devkitc-1-slave]
extends = common
board_build.cmake_extra_args =
    -DRANGING_PIO_ENV=esp32-s3-devkitc-1-slave
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -D FORCE_RANGING_ROLE=2
